<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>    
    <title>Document</title>
</head>
<body>
    <div class="carousel slide" data-bs-ride="carousel"  id="banner">
        <div class="carousel-inner">
            <div class="carousel-item active" >
                <img src="../public/images/banner_1.png" style="height: 500px; width: 100%; background-size: cover;" >

            </div>
            <div class="carousel-item " data-bs-interval="4000">
                <img src="../public/images/banner_2.jpg" style="height: 500px; width: 100%; background-size: cover;">

            </div>
            <div class="carousel-item " data-bs-interval="4000">
                <img src="../public/images/banner_3.jpg" style="height: 500px; width: 100%; background-size: cover;">

            </div>
            
            
                 
        </div>
            <button data-bs-theme="dark" data-bs-slide="prev" data-bs-target="#banner" class="carousel-control-prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button data-bs-theme="dark" data-bs-slide="next" data-bs-target="#banner" class="carousel-control-next">
                <span class="carousel-control-next-icon"></span>
            </button>
            <div class="carousel-indicators">
                <button class="active" data-bs-slide-to="0" data-bs-target="#banner" data-bs-theme="dark"></button>
                <button  data-bs-slide-to="1" data-bs-target="#banner" data-bs-theme="dark"></button>
                <button  data-bs-slide-to="2" data-bs-target="#banner" data-bs-theme="dark"></button>
            </div>
            
    </div>
    
</body>
</html>
