<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="Stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="shortcut icon" href="https://image.similarpng.com/file/similarpng/very-thumbnail/2021/01/Netflix-logo-on-transparent-background-PNG.png" type="image/x-icon">
    <style>
        body{
            height: 100vh;
            background-image: url("../public/images/Netflix.jpg");
            background-size: cover;
        }
        .shade {
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            margin-top: -10px;
            margin-left: -10px;
            width: 102%;

        }
        header{
            color: white;
            padding: 50px 200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Arial;
          
        }
        .brand-title{
            color: red;
            font-size: 50px;
            font-weight: bold;
        }
        .language{
            border: 1px solid rgb(178, 165, 165);
            padding: 5px 10px;
            border-radius: 5px;
            width: 150px;
            display: flex;
            justify-content: space-between;
            background-color: rgba(0, 0, 0, 0.7);
        }
        .btn-signin{
            background-color: red;
            color: white;
            padding: 5px; 
            border-radius: 5px;
            width: 80px;
            text-align: center;
            margin-left: 20px;
        }
        .shortcuts{
            
            display: flex;
            align-items:center ;
        }
        main{
            margin-top: 100px;
            color: white;
            text-align: center;
            font-family: Arial;
            padding-top: 50px;
        }
        .main-title{
            font-size: 65px;
            font-weight: bold;
            
        }
        .main-subtitle{
            font-size: 25px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 20px;

        }
        section{
            margin-top: 50px;
            font-size: 20px;
        }
        .form{
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .email{
            border: 1px solid lightblue;
            border-radius: 5px;
            padding: 15px;
            text-align: left;
            
            width: 350px;
            background-color: rgba(0, 0, 0, 0.7);
            margin-right: 20px;

        }
        .btn-start{
            
            padding: 15px;
            text-align: center;
            width: 180px;
            background-color: red;
            font-weight: bold;
            font-size: 25px;
            border-radius: 5px;


        }




    </style>
</head>
<body>
    <div class="shade">
        <header>
            <div>
                <span class="brand-title">NETFLIX</span>

            </div>
            <div class="shortcuts">
                <div class="language">
                    <span class="bi bi-translate"></span>
                    <span>English</span>
                    <span class="bi bi-chevron-down"></span>
                </div>
                <div class="btn-signin">Sign In</div>


            </div>
        
        </header>
        <main>
            <div class="main-title">Unlimited movies,<br> shows, and more</div>
            <div class="main-subtitle">Starts at ₹149. Cancel at any time.</div>
            <section>
                <div>Ready to watch? Enter your email to create or restart your membership.</div>
                <div class="form">
                    <div class="email"> Email address</div>
                    <div class="btn-start">Get start   <span class="bi bi-chevron-right"></span></div>
                
            </section>
        </main>
    </div>
    
</body>
</html>
