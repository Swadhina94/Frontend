<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <title>Document</title>
    <style>
        body{
        display: flex;
        background-color: aquamarine;
            
        }
        .card{
            width: 200px;
            margin: 20px;
            border: 1px solid rgb(235,233,233);
            border-radius: 10px;
        }
        .card-img{
            width: 100%;
            height: 150px;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }
        .card-body{
            padding: 10px;
            font-family: Arial;
            height: 150px;
        }
        .card-title{
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        .rating{
            text-align: center;
            color: rgb(96, 239, 113);
        }
        .course-details{
            list-style: none;
            margin-left: -30px;
        
        }
        .course-details li{
            margin-bottom: 15px;
        }
        .card-footer{
            display: contents;
            
        }
        .btn-add{
            padding: 10px;
            text-align: center;
            background-color: rgb(6, 6, 19);
            font-family: Arial;
            font-size: 20px;
            color: white;
            border-bottom-left-radius: 5px;
            
        }
        </style>


    
</head>
<body>
    <div class="card">
        <div class="card-hader">
            <img src="../public/images/korean-store.png" class="card-img" >
        </div>
        <div class="card-body">
            <div class="card-title">Korean-Store</div>
                <div class="rating">
                <span class="bi bi-star-fill"></span>
                <span class="bi bi-star-fill"></span>
                <span class="bi bi-star-fill"></span>
                <span class="bi bi-star-fill"></span>
                <span class="bi bi-star-fill"></span>
                <span>5</span>

            </div>
            <ul class="course-details">
            <li>$ 249</li>
            
        </ul>
        </div>
            <div class="card-footer">
            <div class="btn-add"><span class="bi bi-cart-plus">&nbsp; Add</span> </div>
            
        </div> 
    </div>
        <div class="card">
        <div class="card-hader">
            <img src="../public/images/shirts.png" class="card-img" >
        </div>
        <div class="card-body">
            <div class="card-title">Shirts</div>
                <div class="rating">
                <span class="bi bi-star-fill"></span>
                <span class="bi bi-star-fill"></span>
                <span class="bi bi-star-fill"></span>
                <span class="bi bi-star-fill"></span>
                <span class="bi bi-star-fill"></span>
                <span>5</span>

            </div>
            <ul class="course-details">
            <li>$ 149</li>
            
        </ul>
        </div>
            <div class="card-footer">
            <div class="btn-add"><span class="bi bi-cart-plus">&nbsp; Add</span> </div>
            
        </div> 
    </div>
        <div class="card">
        <div class="card-hader">
            <img src="../public/images/jeans.png" class="card-img" >
        </div>
        <div class="card-body">
            <div class="card-title">Jeans</div>
                <div class="rating">
                <span class="bi bi-star-fill"></span>
                <span class="bi bi-star-fill"></span>
                <span class="bi bi-star-fill"></span>
                <span class="bi bi-star-fill"></span>
                <span class="bi bi-star-fill"></span>
                <span>5</span>

            </div>
            <ul class="course-details">
            <li>$ 199</li>
            
        </ul>
        </div>
            <div class="card-footer">
            <div class="btn-add"><span class="bi bi-cart-plus">&nbsp; Add</span> </div>
            
        </div> 
    </div>
    
</body>
</html>
