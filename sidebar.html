<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sidebar</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        nav{
            width:300px;
            background-color: rgb(210, 237, 249);
            padding: 20px;
            font-family: Arial;
            height:700px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;

        }
        .bi-clouds-fill{
            font-size: 40px;
            font-weight: bold;
            padding-bottom: 10px;
        }
        .nav-subtitle{
            font-size: 18px;
            margin-bottom: 20px;
        }
        .btn-add{
            background-color: rgb(10, 10, 10);
            padding: 10px;
            text-align: center;
            color: white;
            font-size: 20px;
        }
        .nav-menu{
            list-style: none;
            margin-top: 30px;
            margin-left: -40px;
        }
        .nav-menu li{
            padding: 10px;
            margin-bottom: 10px;
            margin-top: 10px;
            background-color: antiquewhite;
            font-size: 20px;

        }
        .btn-signout {
            padding: 10px;
            background-color: rgb(136, 135, 135);
            color: white;
            text-align: center;
            font-size: 20px;
        }
        body{
            display: grid;
            grid-template-columns: 3fr 9fr;
        }
        main{
            background-color: rgb(247, 205, 153);
            height: 700px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <div>
            <div class="bi bi-clouds-fill">SkyCast</div>
            <div class="nav-subtitle">PROFESSIONAL WEATHER</div>
            <div class="btn-add">
                <span class="bi bi-plus-lg"></span>
                <span>Add Location</span>
            </div>
            <ul class="nav-menu">
                <li class="bi bi-columns-gap"><span>Dashboard</span></li>
                <li class="bi bi-calender-date"><span>ForceCast</span></li>
                <li class="bi bi-radar"><span>Radar</span></li>
                <li class="bi bi-wine"><span>Air Quality</span></li>
                <li class="bi bi-gear"><span>Setting</span></li>
            </ul>
        </div>
        <div>
            <div class="btn-signout">
                <span class="bi bi-box-arrow-right">Signout</span>
            </div>

        </div>
    </nav>
    <main>

    </main>
    
    
</body>
</html>
